<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danmarkskort over Folkeskolers Karaktersnit</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        
        header { background: #1a252f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; }
        #status { font-size: 0.9rem; color: #bdc3c7; }

        #container { display: flex; flex: 1; overflow: hidden; }
        #map { flex: 1; height: 100%; }
        
        #sidebar { width: 300px; background: #f8f9fa; border-left: 1px solid #dee2e6; padding: 20px; overflow-y: auto; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .color-box { width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
        
        .stat-card { background: white; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-top: 15px; }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 0.85rem; color: #6c757d; }
        .stat-card div { font-size: 1.3rem; font-weight: bold; color: #212529; }
    </style>
</head>
<body>

<header>
    <h1>Folkeskolers Karaktersnit i Danmark</h1>
    <div id="status">Klargør kort...</div>
</header>

<div id="container">
    <div id="map"></div>
    <div id="sidebar">
        <h3>Karakterskala</h3>
        <div class="legend-item"><div class="color-box" style="background:#2b8a3e"></div> Snit ≥ 8,5</div>
        <div class="legend-item"><div class="color-box" style="background:#40c057"></div> Snit 7,5 - 8,4</div>
        <div class="legend-item"><div class="color-box" style="background:#fab005"></div> Snit 6,5 - 7,4</div>
        <div class="legend-item"><div class="color-box" style="background:#fa5252"></div> Snit < 6,5</div>
        <div class="legend-item"><div class="color-box" style="background:#868e96"></div> Ingen data / Ukendt</div>

        <div class="stat-card">
            <h3>Placerede Skoler</h3>
            <div id="count-display">0</div>
        </div>
        <div class="stat-card">
            <h3>Fejlede/Avisviste Søgninger</h3>
            <div id="fail-display">0</div>
        </div>
    </div>
</div>

<script>
    // 1. Initialisér kortet med OpenStreetMap (kræver INGEN API-nøgle)
    const map = L.map('map').setView([56.0, 11.6], 7);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> bidragsydere',
        maxZoom: 19
    }).addTo(map);

    // Hjælpefunktion til farvelægning efter karakter
    function getMarkerColor(snitStr) {
        if (!snitStr) return '#868e96';
        const snit = parseFloat(snitStr.replace(',', '.'));
        if (isNaN(snit)) return '#868e96';
        if (snit >= 8.5) return '#2b8a3e';
        if (snit >= 7.5) return '#40c057';
        if (snit >= 6.5) return '#fab005';
        return '#fa5252';
    }

    // Hjælpefunktion til geokodning hos DAWA med fallback
    async function getCoordinates(navn, kommune) {
        // Prøv 1: Søg på skole og kommune
        try {
            let url = `https://api.dawa.dk/adgangsadresser?q=${encodeURIComponent(navn + ' ' + kommune)}&per_side=1`;
            let res = await fetch(url);
            let data = await res.json();
            
            if (data && data.length > 0 && data[0].adgangspunkt) {
                return { lat: data[0].adgangspunkt.koordinater[1], lng: data[0].adgangspunkt.koordinater[0] };
            }

            // Prøv 2: Søg kun på kommune (placeres i midten af kommunen som fallback)
            url = `https://api.dawa.dk/kommuner?navn=${encodeURIComponent(kommune)}`;
            res = await fetch(url);
            data = await res.json();
            if (data && data.length > 0 && data[0].visueltcenter) {
                return { lat: data[0].visueltcenter[1], lng: data[0].visueltcenter[0] };
            }
        } catch (err) {
            console.warn(`Netværksfejl under søgning på: ${navn}`, err);
        }
        return null;
    }

    // 2. Indlæs og behandl skoler
    async function loadSchoolData() {
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('count-display');
        const failEl = document.getElementById('fail-display');

        try {
            statusEl.innerText = 'Henter JSON-fil...';
            const response = await fetch('folkeskoler_2026.json');
            
            if (!response.ok) {
                throw new Error(`Kunne ikke finde filen folkeskoler_2026.json (Status ${response.status})`);
            }

            const skoler = await response.json();
            statusEl.innerText = `Indlæste ${skoler.length} skoler. Placerer på kortet...`;

            let successCount = 0;
            let failCount = 0;

            for (const skole of skoler) {
                const navn = skole.institution;
                const kommune = skole.beliggenhedskommune;
                const snit = skole['gennemsnit-bundneprøver'] || 'Ikke oplyst';
                const ikkeBestaaet = skole['02danskmat'] || 'N/A';

                const coords = await getCoordinates(navn, kommune);

                if (coords) {
                    const color = getMarkerColor(snit);
                    
                    L.circleMarker([coords.lat, coords.lng], {
                        radius: 6,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    })
                    .bindPopup(`
                        <div style="font-size:13px;">
                            <strong style="font-size:14px;">${navn}</strong><br>
                            <span style="color:#666;">Kommune: ${kommune}</span><br><br>
                            <b>Gennemsnit (bundne prøver):</b> ${snit}<br>
                            <b>Ej bestået dansk/mat:</b> ${ikkeBestaaet}
                        </div>
                    `)
                    .addTo(map);

                    successCount++;
                    countEl.innerText = successCount;
                } else {
                    failCount++;
                    failEl.innerText = failCount;
                }

                // Lille forsinkelse (100 ms) så vi ikke udløser rate-limits
                await new Promise(r => setTimeout(r, 100));
            }

            statusEl.innerText = 'Kortlægning færdig!';

        } catch (error) {
            statusEl.innerText = `Fejl: ${error.message}`;
            console.error(error);
        }
    }

    loadSchoolData();
</script>

</body>
</html>
