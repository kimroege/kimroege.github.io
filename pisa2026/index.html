<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danmarkskort over Folkeskolers Karaktersnit - Aalborg Kommune</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        
        header { background: #1a252f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; }
        #status { font-size: 0.9rem; color: #4dabf7; font-weight: 500; }

        #container { display: flex; flex: 1; overflow: hidden; }
        #map { flex: 1; height: 100%; }
        
        #sidebar { width: 340px; background: #f8f9fa; border-left: 1px solid #dee2e6; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .color-box { width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
        
        .stat-card { background: white; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 0.85rem; color: #6c757d; }
        .stat-card div { font-size: 1.3rem; font-weight: bold; color: #212529; }

        .btn-download {
            display: none;
            width: 100%;
            padding: 10px;
            background: #2b8a3e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-download:hover { background: #237032; }

        /* Uplacerede skoler sektion */
        #unplaced-container { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .unplaced-card { background: white; border: 1px solid #ffc9c9; border-radius: 6px; padding: 10px; font-size: 0.85rem; }
        .unplaced-title { font-weight: bold; color: #c92a2a; margin-bottom: 4px; }
        .unplaced-input-group { display: flex; gap: 5px; margin-top: 6px; }
        .unplaced-input-group input { flex: 1; padding: 5px 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 0.8rem; }
        .unplaced-input-group button { padding: 5px 10px; background: #228be6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .unplaced-input-group button:hover { background: #1c7ed6; }
    </style>
</head>
<body>

<header>
    <h1>Folkeskolers Karaktersnit - Aalborg Kommune</h1>
    <div id="status">Klargør kort...</div>
</header>

<div id="container">
    <div id="map"></div>
    <div id="sidebar">
        <div>
            <h3 style="margin-top:0;">Karakterskala</h3>
            <div class="legend-item"><div class="color-box" style="background:#2b8a3e"></div> Snit ≥ 8,5</div>
            <div class="legend-item"><div class="color-box" style="background:#40c057"></div> Snit 7,5 - 8,4</div>
            <div class="legend-item"><div class="color-box" style="background:#fab005"></div> Snit 6,5 - 7,4</div>
            <div class="legend-item"><div class="color-box" style="background:#fa5252"></div> Snit < 6,5</div>
            <div class="legend-item"><div class="color-box" style="background:#868e96"></div> Ingen data / Ukendt</div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="stat-card" style="flex: 1;">
                <h3>Placerede</h3>
                <div id="count-display">0</div>
            </div>
            <div class="stat-card" style="flex: 1;">
                <h3>Uplacerede</h3>
                <div id="unplaced-count-display">0</div>
            </div>
        </div>

        <button id="download-btn" class="btn-download">💾 Download Aalborg JSON</button>

        <div id="unplaced-section">
            <h3 style="margin-bottom: 5px;">Uplacerede Skoler (Aalborg)</h3>
            <div id="unplaced-container"><em>Ingen uplacerede endnu...</em></div>
        </div>
    </div>
</div>

<script>
    // Initialisér kortet centreret over Aalborg Kommune
    const map = L.map('map').setView([57.048, 9.918], 11);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap bidragsydere',
        maxZoom: 19
    }).addTo(map);

    function getMarkerColor(snitStr) {
        if (!snitStr) return '#868e96';
        const snit = parseFloat(String(snitStr).replace(',', '.'));
        if (isNaN(snit)) return '#868e96';
        if (snit >= 8.5) return '#2b8a3e';
        if (snit >= 7.5) return '#40c057';
        if (snit >= 6.5) return '#fab005';
        return '#fa5252';
    }

    // Geokodning via OpenStreetMap Nominatim uden fallback til midte
    async function fetchCoordsPræcis(navn, kommune, adresseManuel = null) {
        let forsoeg = 0;
        const maxForsoeg = 3;

        const queryText = adresseManuel ? adresseManuel : `${navn}, ${kommune}, Danmark`;
        const query = encodeURIComponent(queryText);
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`;

        while (forsoeg < maxForsoeg) {
            try {
                const res = await fetch(url, { 
                    headers: { 'User-Agent': 'FolkeskoleKortVisualisering/1.0' } 
                });

                if (res.status === 429) {
                    forsoeg++;
                    const ventetid = forsoeg * 2500;
                    console.warn(`429 Modtaget for "${queryText}". Venter ${ventetid / 1000}s...`);
                    await new Promise(r => setTimeout(r, ventetid));
                    continue;
                }

                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) {
                        return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                    }
                }
                break;
            } catch (e) {
                forsoeg++;
                await new Promise(r => setTimeout(r, 2000));
            }
        }
        return null;
    }

    let opdateredeSkoler = [];

    function tilfoejMarkerTilKort(skole, coords) {
        const navn = skole.institution;
        const kommune = skole.beliggenhedskommune;
        const snit = skole['gennemsnit-bundneprøver'] || 'Ikke oplyst';

        skole.lat = coords[0];
        skole.lng = coords[1];

        L.circleMarker(coords, {
            radius: 7,
            fillColor: getMarkerColor(snit),
            color: '#ffffff',
            weight: 1.5,
            fillOpacity: 0.85
        })
        .bindPopup(`
            <div style="font-size:13px;">
                <strong>${navn}</strong><br>
                <span style="color:#666">${kommune} Kommune</span><br><br>
                <b>Karaktersnit:</b> ${snit}<br>
                <b>Ej bestået dansk/mat:</b> ${skole['02danskmat'] || 'N/A'}
            </div>
        `)
        .addTo(map);
    }

    async function loadSchoolData() {
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('count-display');
        const unplacedCountEl = document.getElementById('unplaced-count-display');
        const unplacedContainer = document.getElementById('unplaced-container');
        const downloadBtn = document.getElementById('download-btn');

        try {
            statusEl.innerText = 'Henter folkeskoler_2026.json...';
            const response = await fetch('folkeskoler_2026.json');
            if (!response.ok) throw new Error('Kunne ikke hente filen folkeskoler_2026.json');
            
            const skolerAlle = await response.json();
            
            // --- FILTER: KUN AALBORG KOMMUNE ---
            const skoler = skolerAlle.filter(s => s.beliggenhedskommune === "Aalborg");
            
            statusEl.innerText = `Placerer ${skoler.length} skoler i Aalborg Kommune...`;

            let placedCount = 0;
            let unplacedCount = 0;
            unplacedContainer.innerHTML = '';

            for (let i = 0; i < skoler.length; i++) {
                const skole = { ...skoler[i] };
                const navn = skole.institution;
                const kommune = skole.beliggenhedskommune;

                const coords = await fetchCoordsPræcis(navn, kommune);

                if (coords) {
                    tilfoejMarkerTilKort(skole, coords);
                    placedCount++;
                    countEl.innerText = placedCount;
                } else {
                    skole.lat = null;
                    skole.lng = null;
                    unplacedCount++;
                    unplacedCountEl.innerText = unplacedCount;

                    // Tilføj til listen over uplacerede i sidepanelet
                    const card = document.createElement('div');
                    card.className = 'unplaced-card';
                    card.id = `unplaced-${skole.institutionsnummer}`;
                    card.innerHTML = `
                        <div class="unplaced-title">${navn}</div>
                        <div>${kommune} Kommune</div>
                        <div class="unplaced-input-group">
                            <input type="text" id="input-${skole.institutionsnummer}" placeholder="Indtast adresse (fx Vestergade 12, Aalborg)">
                            <button onclick="opdaterManuelt('${skole.institutionsnummer}')">Opdatér</button>
                        </div>
                    `;
                    unplacedContainer.appendChild(card);
                }

                opdateredeSkoler.push(skole);
                statusEl.innerText = `Placerer skoler i Aalborg... (${i + 1}/${skoler.length})`;

                // 1.1 sekunders pause for at undgå rate-limits
                await new Promise(r => setTimeout(r, 1100));
            }

            statusEl.innerText = `Færdig! ${skoler.length} skoler i Aalborg behandlet.`;

            // Aktiver Download-knap
            downloadBtn.style.display = 'block';
            downloadBtn.onclick = () => downloadJSON();

        } catch (err) {
            statusEl.innerText = `Fejl: ${err.message}`;
            console.error(err);
        }
    }

    // Manuel opdatering for uplacerede skoler
    window.opdaterManuelt = async function(instNummer) {
        const inputEl = document.getElementById(`input-${instNummer}`);
        const adresse = inputEl.value.trim();
        if (!adresse) {
            alert('Indtast venligst en adresse.');
            return;
        }

        const skoleObj = opdateredeSkoler.find(s => s.institutionsnummer === instNummer);
        if (!skoleObj) return;

        inputEl.disabled = true;
        const coords = await fetchCoordsPræcis(skoleObj.institution, skoleObj.beliggenhedskommune, adresse);

        if (coords) {
            tilfoejMarkerTilKort(skoleObj, coords);

            const countEl = document.getElementById('count-display');
            const unplacedCountEl = document.getElementById('unplaced-count-display');
            countEl.innerText = parseInt(countEl.innerText) + 1;
            unplacedCountEl.innerText = parseInt(unplacedCountEl.innerText) - 1;

            const card = document.getElementById(`unplaced-${instNummer}`);
            if (card) card.remove();

            map.setView(coords, 14);
        } else {
            alert(`Kunne ikke finde adressen "${adresse}". Prøv at tilføje husnummer eller postnummer.`);
            inputEl.disabled = false;
        }
    };

    function downloadJSON() {
        const jsonString = JSON.stringify(opdateredeSkoler, null, 2);
        console.log("=== AALBORG KOORDINATER DUMP ===");
        console.log(jsonString);

        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'aalborg_folkeskoler_med_koordinater.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    loadSchoolData();
</script>

</body>
</html>
