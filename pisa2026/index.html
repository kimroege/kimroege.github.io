<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danmarkskort over Folkeskolers Karaktersnit</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        
        header { background: #1a252f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; }
        #status { font-size: 0.9rem; color: #4dabf7; font-weight: 500; }

        #container { display: flex; flex: 1; overflow: hidden; }
        #map { flex: 1; height: 100%; }
        
        #sidebar { width: 300px; background: #f8f9fa; border-left: 1px solid #dee2e6; padding: 20px; overflow-y: auto; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .color-box { width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
        
        .stat-card { background: white; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-top: 15px; }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 0.85rem; color: #6c757d; }
        .stat-card div { font-size: 1.3rem; font-weight: bold; color: #212529; }

        .btn-download {
            display: none;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #2b8a3e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-download:hover { background: #237032; }
    </style>
</head>
<body>

<header>
    <h1>Folkeskolers Karaktersnit i Danmark</h1>
    <div id="status">Klargør kort...</div>
</header>

<div id="container">
    <div id="map"></div>
    <div id="sidebar">
        <h3>Karakterskala</h3>
        <div class="legend-item"><div class="color-box" style="background:#2b8a3e"></div> Snit ≥ 8,5</div>
        <div class="legend-item"><div class="color-box" style="background:#40c057"></div> Snit 7,5 - 8,4</div>
        <div class="legend-item"><div class="color-box" style="background:#fab005"></div> Snit 6,5 - 7,4</div>
        <div class="legend-item"><div class="color-box" style="background:#fa5252"></div> Snit < 6,5</div>
        <div class="legend-item"><div class="color-box" style="background:#868e96"></div> Ingen data / Ukendt</div>

        <div class="stat-card">
            <h3>Placerede Skoler</h3>
            <div id="count-display">0</div>
        </div>

        <button id="download-btn" class="btn-download">💾 Download JSON-fil</button>
    </div>
</div>

<script>
    const map = L.map('map').setView([56.0, 11.6], 7);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap bidragsydere',
        maxZoom: 19
    }).addTo(map);

    function getMarkerColor(snitStr) {
        if (!snitStr) return '#868e96';
        const snit = parseFloat(String(snitStr).replace(',', '.'));
        if (isNaN(snit)) return '#868e96';
        if (snit >= 8.5) return '#2b8a3e';
        if (snit >= 7.5) return '#40c057';
        if (snit >= 6.5) return '#fab005';
        return '#fa5252';
    }

    async function fetchCoordsNominatim(navn, kommune) {
        try {
            let query = encodeURIComponent(`${navn}, ${kommune}, Danmark`);
            let url = `https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`;
            
            let res = await fetch(url, { headers: { 'User-Agent': 'FolkeskoleKortApp/1.0' } });
            let data = await res.json();
            
            if (data && data.length > 0) {
                return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
            }

            query = encodeURIComponent(`${kommune} Kommune, Danmark`);
            url = `https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`;
            res = await fetch(url, { headers: { 'User-Agent': 'FolkeskoleKortApp/1.0' } });
            data = await res.json();
            if (data && data.length > 0) {
                return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
            }
        } catch (e) {
            console.warn(`Fejl ved søgning på ${navn}:`, e);
        }
        return null;
    }

    async function loadSchoolData() {
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('count-display');
        const downloadBtn = document.getElementById('download-btn');

        try {
            statusEl.innerText = 'Henter folkeskoler_2026.json...';
            const response = await fetch('folkeskoler_2026.json');
            if (!response.ok) throw new Error('Kunne ikke hente filen folkeskoler_2026.json');
            
            const skoler = await response.json();
            statusEl.innerText = `Placerer ${skoler.length} skoler på kortet...`;

            let count = 0;
            const opdateredeSkoler = [];

            for (let i = 0; i < skoler.length; i++) {
                const skole = { ...skoler[i] };
                const navn = skole.institution;
                const kommune = skole.beliggenhedskommune;
                const snit = skole['gennemsnit-bundneprøver'] || 'Ikke oplyst';

                const coords = await fetchCoordsNominatim(navn, kommune);

                if (coords) {
                    skole.lat = coords[0];
                    skole.lng = coords[1];

                    L.circleMarker(coords, {
                        radius: 6,
                        fillColor: getMarkerColor(snit),
                        color: '#ffffff',
                        weight: 1,
                        fillOpacity: 0.85
                    })
                    .bindPopup(`
                        <div style="font-size:13px;">
                            <strong>${navn}</strong><br>
                            <span style="color:#666">${kommune} Kommune</span><br><br>
                            <b>Karaktersnit:</b> ${snit}<br>
                            <b>Ej bestået dansk/mat:</b> ${skole['02danskmat'] || 'N/A'}
                        </div>
                    `)
                    .addTo(map);

                    count++;
                    countEl.innerText = count;
                } else {
                    skole.lat = null;
                    skole.lng = null;
                }

                opdateredeSkoler.push(skole);
                statusEl.innerText = `Placerer skoler... (${i + 1}/${skoler.length})`;

                // Pause på 1,1 sekund for at overholde Nominatims regler
                await new Promise(r => setTimeout(r, 1100));
            }

            statusEl.innerText = 'Færdig! Alle skoler behandlet.';

            // 1. Dump filen til konsollen (F12 / Inspect -> Console)
            const jsonString = JSON.stringify(opdateredeSkoler, null, 2);
            console.log("=== KOORDINATER DUMP START ===");
            console.log(jsonString);
            console.log("=== KOORDINATER DUMP SLUT ===");

            // 2. Aktiver Download-knappen
            downloadBtn.style.display = 'block';
            downloadBtn.onclick = () => {
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'folkeskoler_med_koordinater.json';
                a.click();
                URL.revokeObjectURL(url);
            };

        } catch (err) {
            statusEl.innerText = `Fejl: ${err.message}`;
            console.error(err);
        }
    }

    loadSchoolData();
</script>

</body>
</html>
